name: Build Rainy for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow

      - name: Build Rainy
        run: |
          python -m PyInstaller --windowed --name Rainy --icon=icon.png --add-data "sounds;sounds" main.py

      - name: Create ZIP
        run: |
          Compress-Archive -Path dist\Rainy\* -DestinationPath dist\Rainy-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Rainy-Windows
          path: dist/Rainy-Windows.zip
